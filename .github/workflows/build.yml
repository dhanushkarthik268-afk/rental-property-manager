name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: g++ -std=c++17 -Wall -Wextra -Werror -o rental_manager src/main.cpp
      - name: Run tests
        run: bash tests/run_tests.sh
